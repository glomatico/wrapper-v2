[package]
name = "wrapperd"
version = "1.0.0"
edition = "2021"
publish = false
description = "General-purpose Apple Music / Temari-compatible context server"

[[bin]]
name = "wrapperd"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
form_urlencoded = "1.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal"] }
zeroize = "1.9"
