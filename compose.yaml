services:
  wrapper:
    # Build privately first with tools/build-docker.sh.
    # The image contains the pinned Apple Music native libraries.
    image: ${WRAPPER_IMAGE:-wrapper-v2:local}
    # .env is optional; when supplied it can provide the original device
    # identity, automatic login credentials, and other advanced settings.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # Reap an orphaned launcher or namespace init after an abrupt supervisor kill.
    init: true
    # Docker's daemon need not be rootless. The HTTP server itself runs as a
    # non-root UID, while its native launcher temporarily receives capabilities.
    user: "${WRAPPER_UID:-1000}:${WRAPPER_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    security_opt:
      - apparmor:unconfined
    ports:
      - "127.0.0.1:${WRAPPER_HTTP_PORT:-8080}:80"
    environment:
      WRAPPER_DNS: "${WRAPPER_DNS:-1.1.1.1,8.8.8.8}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      # The complete Android rootfs is built into this private image.
      # Named volume by default; a legacy ./data bind mount can be retained by
      # setting WRAPPER_DATA_DIR=./data in .env.
      - ${WRAPPER_DATA_DIR:-wrapper_data}:/srv/wrapper/rootfs/data/data/com.apple.android.music/files:rw
    tmpfs:
      - /srv/wrapper/rootfs/tmp:rw,nosuid,nodev,mode=1777
    stop_grace_period: 15s

volumes:
  wrapper_data:
