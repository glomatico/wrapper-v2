services:
  wrapper:
    # Build privately first with tools/build-docker.sh.
    # The image contains the pinned Apple Music native libraries.
    image: ${WRAPPER_IMAGE:?Set the locally built amd64 or arm64 image}
    # Also passes optional WRAPPER_USERNAME/WRAPPER_PASSWORD for auto-login.
    env_file: .env
    restart: unless-stopped
    # Reap an orphaned launcher or namespace init after an abrupt supervisor kill.
    init: true
    # Docker's daemon need not be rootless. The HTTP server itself runs as a
    # non-root UID, while its native launcher temporarily receives capabilities.
    user: "${WRAPPER_UID:-1000}:${WRAPPER_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    security_opt:
      - apparmor:unconfined
    ports:
      - "127.0.0.1:${WRAPPER_HTTP_PORT:-80}:80"
    environment:
      WRAPPER_DEVICE_INFO: "${WRAPPER_DEVICE_INFO:?Set a stable nine-field device identifier}"
      WRAPPER_DNS: "${WRAPPER_DNS:-1.1.1.1,8.8.8.8}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      # The complete Android rootfs is built into this private image.
      # Mount only account/session state as writable; never bake it into Docker.
      - ${WRAPPER_DATA_DIR:-./data}:/srv/wrapper/rootfs/data/data/com.apple.android.music/files:rw
    tmpfs:
      - /srv/wrapper/rootfs/tmp:rw,nosuid,nodev,mode=1777
    stop_grace_period: 15s
