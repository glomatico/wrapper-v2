name: Rust API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --check
      - name: Linux worker namespace and lifecycle tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror native/launcher.cpp -o /tmp/worker-launch
          sudo python3 tests/launcher_namespace.py /tmp/worker-launch -v
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust unit tests
        run: cargo test --locked
      - name: Build HTTP server for integration tests
        run: cargo build --locked
      - name: Synthetic HTTP worker and APK staging tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
